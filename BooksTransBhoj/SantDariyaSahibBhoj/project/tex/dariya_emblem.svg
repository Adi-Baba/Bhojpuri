<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Tilted Diamond Outer Frame -->
  <g transform="translate(250, 250) rotate(45)">
    <rect x="-160" y="-160" width="320" height="320" fill="none" stroke="#3D3428" stroke-width="6"/>
    <rect x="-172" y="-172" width="344" height="344" fill="none" stroke="#3D3428" stroke-width="2"/>
    <!-- Ornamental Diamond Edge Dots -->
    <circle cx="-160" cy="-160" r="8" fill="#3D3428" />
    <circle cx="160" cy="-160" r="8" fill="#3D3428" />
    <circle cx="-160" cy="160" r="8" fill="#3D3428" />
    <circle cx="160" cy="160" r="8" fill="#3D3428" />
  </g>

  <!-- Central Spiritual Lamp & Lotus (ज्ञान दीपक) Icon -->
  <g fill="#3D3428">
    <!-- Flame of Knowledge (ज्ञान ज्योति) -->
    <path d="M 250 110 C 270 150 285 180 250 220 C 215 180 230 150 250 110 Z" />
    <path d="M 250 135 C 260 160 270 180 250 205 C 230 180 240 160 250 135 Z" fill="#C5B99D" />

    <!-- Lamp Bowl (दीपक) -->
    <path d="M 180 240 Q 250 290 320 240 Q 250 260 180 240 Z" />
    <rect x="235" y="260" width="30" height="40" rx="3" />
    <rect x="200" y="300" width="100" height="12" rx="4" />

    <!-- Lotus Petals Base (कमल आधार) -->
    <path d="M 250 315 C 210 325 170 300 140 330 C 180 350 220 340 250 330 C 280 340 320 350 360 330 C 330 300 290 325 250 315 Z" />
  </g>
</svg>
